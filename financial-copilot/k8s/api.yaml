apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-copilot-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: financial-copilot-api
  template:
    metadata:
      labels:
        app: financial-copilot-api
    spec:
      containers:
        - name: api
          image: financial-copilot-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: financial-copilot-config
---
apiVersion: v1
kind: Service
metadata:
  name: financial-copilot-api
spec:
  selector:
    app: financial-copilot-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
